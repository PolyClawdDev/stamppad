services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stamp
      POSTGRES_PASSWORD: stamp
      POSTGRES_DB: stamp
    ports:
      - "5432:5432"
    volumes:
      - stamp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stamp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stamp_pg:
